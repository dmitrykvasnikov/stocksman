[package]
name = "stocksman"
version = "0.1.0"
description = "Read-only crypto market charting workbench"
authors = ["Stocksman contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stocksman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3.31"
rusqlite = { version = "0.32.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.23.1", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
